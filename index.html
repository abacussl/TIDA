<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <!--<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">-->
	<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
	<link rel="stylesheet" type="text/css" href="print.css" media="print">
    <title>Ward List Calculator</title>
	
<style>
    @media print {
        body {
            font-size: 12pt;
        }

        .table {
            border-collapse: separate;
            border-spacing: 10px; /* Adjust the value to increase or decrease the gap */
        }

        th, td {
            padding: 10px; /* Optional: Add padding to cells for better spacing */
        }
    }
</style>

</head>
<body>
    <div class="container mt-5">
	<h1 class="mb-4">Ward Metrics Calculator</h1>
        <form id="wardForm" enctype="multipart/form-data">
            <div class="form-group">
                <label for="startDate">Start Date:</label>
                <input type="date" class="form-control" id="startDate" name="startDate" placeholder="mm/dd/yyyy" required>
            </div>
            <div class="form-group">
                <label for="endDate">End Date:</label>
                <input type="date" class="form-control" id="endDate" name="endDate" placeholder="mm/dd/yyyy" required>
            </div>
            <div class="form-group">
                <label for="csvFile">Upload CSV File:</label>
                <input type="file" class="form-control-file" id="csvFile" name="csvFile" accept=".csv" required>
            </div>
            <button type="button" class="btn btn-primary" onclick="loadWardList()">Ward List</button>
        </form>
        
        <div id="wardInputs" class="mt-3"></div>
        
       <button type="button" class="btn btn-success mt-3" onclick="calculateTable()">Calculate</button>
	   <button type="button" class="btn btn-secondary mt-3" onclick="printResults()">Print Results</button>

		
        
        <div id="resultTable" class="mt-3"></div>
    </div>
	<!--<button type="button" class="btn btn-success mt-3" id="calculateButton">Calculate</button>-->

	<!-- JavaScript -->
	<script src="calculations.js"></script>
<!--	<script>
		document.addEventListener('DOMContentLoaded', function() {
			document.getElementById('calculateButton').addEventListener('click', calculateTable);
    });
</script>-->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script src="calculations.js"></script>
</body>
</html>
